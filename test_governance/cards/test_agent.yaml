test_id: test_agent
theory: >
  guardrail.agent is Stage 1 of the lawkeeper downloadable-prototype
  plan (docs/LAWKEEPER_PROTOTYPE_PLAN.md): wraps Anthropic's real Agent
  SDK with lawkeeper's Law 22 Stop hook, reusing guardrail.core.
  hedge_check's already-tested detection logic rather than
  reimplementing it. Real, honest limitation stated in the module's own
  docstring: the exact field name carrying response text on a live
  Stop event is unverified against real SDK behavior (blocked on a
  real ANTHROPIC_API_KEY this environment doesn't have -- see
  BLOCKERS.md). These tests prove the callback's own logic and the
  options-building wiring are correct against the SDK's documented
  contract; they do not prove the field-name guess is right against a
  real live event, which is exactly why _extract_response_text tries
  multiple candidate field names and fails open rather than crashing
  if none match.
oracle:
  type: reference
  independence: independent
  expression: >
    The Stop-hook tests exercise the real async callback contract
    (async def hook(input_data, tool_use_id, context) -> dict) as
    documented by the SDK, with hand-constructed input dicts -- not
    mocked at the hedge_check level, since that logic is already
    independently tested elsewhere and reusing it here proves the real
    integration, not a stub. The options-building tests mock
    claude_agent_sdk itself (a real external dependency this repo
    doesn't want to require just to run tests) and assert on the real
    structure passed to ClaudeAgentOptions/HookMatcher.
acceptance: "the Stop hook blocks on the same real hedge phrases hedge_check already catches, with a reason naming Law 22; a clean message returns {} to allow; an unrecognized input shape returns {} (fails open) rather than raising; build_governed_options wires law22_stop_hook into the Stop event by default; an explicit hooks= override replaces the default entirely rather than silently merging."
blind_spot: >
  No live SDK session has been run -- the real, currently-unverified
  question (what field name Stop events actually carry response text
  under) cannot be answered by these tests, only by a real
  ANTHROPIC_API_KEY and a live run. Treat this module's field-name
  guess as provisional until that real test happens; _extract_response_
  text is deliberately the one place to fix it when it does.
trust_level: T2
adversarial_review: none
failure_meaning:
  failed: a real regression in the hook wiring, the fail-open behavior, or the options-building logic
  crash: import failure, or claude_agent_sdk's real API shape changed in a way the mock no longer reflects
  pass: the hook correctly reuses hedge_check's detection, fails open on unrecognized input, and options wiring is correct against the documented SDK contract
debug:
  - a failure in TestLaw22StopHook likely means either hedge_check regressed (check that module's own tests first) or the async callback's return-value shape stopped matching the SDK's documented hookSpecificOutput contract
  - a failure in TestBuildGovernedOptions means the real HookMatcher/ClaudeAgentOptions wiring broke -- re-check against the SDK's actual current API before assuming this test's mock is still accurate
  - if a live run ever reveals the real Stop-event field name, update _RESPONSE_TEXT_FIELD_CANDIDATES's order in guardrail/agent.py and this card's blind_spot note, don't just patch the test
