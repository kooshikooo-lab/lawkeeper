test_id: test_orphan_scan
theory: >
  orphan_scan.py is a real, mechanical Law 21 detector ("a capability
  with no consumer is a bug, not neutral"): a single-pass repo scanner
  that flags scripts under scripts/tools with zero real cross-
  references and no one-off-task-naming match, as a real, checkable
  candidate for "built then forgotten." Built after an earlier shell-
  loop version timed out against a 132-script directory -- the whole
  point is correctness at real scale, so the tests use a real temporary
  git repo (real `git init`/`commit`) rather than mocking git, since a
  mocked git layer wouldn't prove the tool works against real git
  output shapes.
oracle:
  type: reference
  independence: independent
  expression: >
    Each test builds a real, minimal git repo with known, hand-placed
    content (a script that IS referenced elsewhere, one that genuinely
    isn't, one with a one-off-pattern name, one whose own docstring
    repeats its own filename) and asserts the scanner's real output
    against what a human reading that same repo would conclude --
    independent of the scanner's internal implementation.
acceptance: "a script genuinely referenced elsewhere is not flagged; a genuinely unreferenced, non-one-off-named script is flagged with an accurate commit count; a one-off-task-named script is never flagged regardless of reference count; a script's own docstring repeating its own filename does not count as an external reference to itself; a repo with no scripts/tools directory returns an empty result rather than erroring."
blind_spot: >
  Basename substring matching is a real heuristic, not a guarantee --
  documented explicitly in the module's own docstring. Two real false-
  positive classes are known and were hit live during the actual round-
  up this tool was built for: a recently-built CLI entry point invoked
  directly by hand (not imported) will correctly show zero cross-
  references and get flagged despite being actively used, and an
  MCP-registered tool (referenced via config, not a Python import) can
  false-positive the same way. Every flagged result is a candidate to
  check, not a proven conclusion -- the round-up document this tool
  produced data for treats its output that way explicitly.
trust_level: T2
adversarial_review: none
failure_meaning:
  failed: a real regression in reference counting, one-off pattern matching, or self-reference subtraction
  crash: git itself unavailable, or a real change to git's output format this parser doesn't handle
  pass: reference counting and one-off exclusion behave correctly against real git repo data
debug:
  - a failure in test_referenced_script_is_not_flagged or test_genuinely_unreferenced_non_one_off_script_is_flagged means the core reference-counting logic broke -- this is the tool's whole purpose, treat as high severity
  - a failure in test_self_reference_in_own_docstring_does_not_count_as_external means the self-reference subtraction broke -- would cause every real script to false-negative (nothing would ever get flagged) since haystack.count() always includes the file's own text
  - a failure in test_one_off_named_script_not_flagged_even_with_zero_refs means the naming-pattern exclusion list regressed -- would cause a flood of false positives against Windwright's dozens of legitimate one-off experiment scripts
