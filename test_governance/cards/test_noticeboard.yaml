test_id: test_noticeboard
theory: >
  scripts/noticeboard.py (copied from Windwright, 2026-09-28) parses posted
  entries back with their fields; `check` shows each entry to a session exactly
  once; machine-board entries reach only the repos they name (or "all"); a
  session seen for the first time sees at most FIRST_SIGHT_SHOW entries; the
  Claude-hook output has the documented JSON shape
  (hookSpecificOutput.hookEventName + additionalContext). Lawkeeper-specific:
  the repo name used for machine-board filtering comes from NOTICEBOARD_REPO or
  the git origin remote, not the folder name, so sessions in worktree folders
  still see entries addressed to lawkeeper.
oracle:
  type: hand-written fixtures
  independence: independent
  expression: "hand-written board text with known ids/fields (not produced by the code under test); the hook JSON shape from Claude Code's settings schema; a hand-made git repo whose folder name (myrepo-wt-feature) differs from its remote name (MyRepo.git)"
acceptance: "exact equality of ids, fields, counts and derived repo names"
blind_spot: >
  Concurrent appends from two processes at the same instant are not exercised.
  The real Claude Code hook invocation is not run by the tests (checked by hand
  once from a worktree on 2026-09-28: entries shown). A remote URL with an
  unusual shape (no path separator) falls back to the folder name. Only the
  repo-name test was mutation-checked; the five tests copied from Windwright
  were not re-mutated here.
trust_level: T4
adversarial_review: none
failure_meaning:
  failed: the noticeboard parses, filters or reports entries wrongly -- sessions may miss notes or see them twice
  crash: noticeboard.py fails to import or its CLI signature changed
  pass: entries round-trip, reach the right repos once each, and the repo name survives worktree folders
debug:
  - "mutation check 2026-09-28: restoring the old folder-name behaviour in repo_name_for makes test_repo_name_from_remote_not_worktree_folder fail (1 failed); restored code passes"
  - if machine-board entries never appear in a session, print noticeboard.REPO_NAME from that checkout and compare with the entry's repos field
