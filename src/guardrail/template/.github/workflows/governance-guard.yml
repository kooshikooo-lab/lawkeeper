name: governance-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + hooks
        # `pip install -e .` alone installs ZERO dependencies -
        # pyproject.toml's [project].dependencies is deliberately empty;
        # pytest/build live under optional-dependencies.dev. The later
        # "Meta-tests" step runs `python -m pytest`, which needs [dev]
        # installed to have ever had a chance of working. Found by
        # actually checking this repo's CI run history (gh run list):
        # every single governance-guard run since the very first commit
        # has failed - this was never once caught before now.
        run: |
          pip install -e ".[dev]"
          python scripts/install_hooks.py
      - name: Run the governance checks
        # ci_checks.py is the actual, host-agnostic source of truth for this
        # sequence (works the same from GitLab CI, Bitbucket, a local
        # pre-push hook, ...) — this workflow is just the GitHub-specific
        # trigger wrapper around it. See that script's own docstring.
        #
        # --on-push only, not on pull_request: on a pull_request event this
        # repo checks out GitHub's synthetic test-merge commit (an ephemeral
        # "Merge <sha> into <sha>" commit that never carries a Tests:/
        # Verification: line and often isn't even the commit that ends up
        # on main - e.g. a rebase merge lands the PR's real commits as-is,
        # each already validated by this exact check when they were made).
        # Checking that synthetic commit made every PR unmergeable
        # regardless of how compliant its real commits were - found by
        # actually trying to merge a real PR, not by inspection. On push,
        # HEAD is the actual commit landing on main, which is what the
        # commit-message check is meant to validate.
        run: |
          python scripts/ci_checks.py ${{ github.event_name == 'push' && '--on-push' || '' }}

  # Found while fixing the dependency-locks job below: this was indented as
  # a child of `guard:` (4 spaces, matching guard's own `runs-on`/`steps`
  # keys) instead of a sibling job under `jobs:` (2 spaces, matching
  # `guard:` itself). GitHub Actions never recognized it as a job at all -
  # the PowerShell 5.1 compatibility lint has never actually run in CI.
  powershell-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 compatibility lint
        shell: powershell
        run: |
          python scripts/check_powershell_51_compat.py

  # NOTE: there used to be a `dependency-locks` job here calling
  # `scripts/compile_requirements.py --check`. That script never existed in
  # this repo - inherited from the Windwright template this project was
  # scaffolded from (same root cause as the hardcoded backend/
  # woodwind_designer scan paths elsewhere). Removed rather than stubbed
  # out: Lawkeeper declares `dependencies = []` in pyproject.toml (only
  # loose `>=` pins in [project.optional-dependencies].dev) and has no
  # requirements.txt/lock file anywhere to check - there was nothing for
  # this job to actually verify. If real dependency pinning is ever added,
  # write compile_requirements.py against real lock files at that point,
  # not before.
