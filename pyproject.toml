[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawkeeper"
version = "0.1.0"
description = "Constitution-as-code governance for agentic + vibe-coded projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.scripts]
lawkeeper = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: this path is relative to the PACKAGE directory (src/guardrail/),
# not the repo root. The template/ folder must live at src/guardrail/template
# for this to actually ship inside a built wheel. Verified with:
#   python -m build --wheel && python -m zipfile -l dist/*.whl | grep template
[tool.setuptools.package-data]
guardrail = ["template/**/*"]

[tool.pytest.ini_options]
python_files = [
    "test_guard_scripts.py",
    "test_template.py",
    "test_init_smoke.py",
]
markers = [
    "slow: end-to-end tests that build a wheel and create a venv (test_init_smoke.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
