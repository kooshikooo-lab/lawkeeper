[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawkeeper"
version = "0.1.0"
description = "Constitution-as-code governance for agentic + vibe-coded projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# requests: needed by THIS repo's own dev/maintainer copies of ai_review.py/
# consensus_review.py/team_chat.py (scripts/, not shipped), same reasoning
# as pytest/build here.
# beautifulsoup4: same reasoning, used by scripts/hardware_scanner/'s
# adapters (real HTML parsing for inet.se/refurbed.se), not the shipped
# guardrail package.
# import-linter: real architecture-boundary checker for this dev repo's own
# src/guardrail/ package (see .importlinter and scripts/system_audit.py's
# check_import_boundaries()) -- ported from Windwright 2026-09-04, dev-only
# since it checks THIS package's own import graph, not something a
# `lawkeeper init` consumer needs unless they add their own .importlinter.
dev = ["pytest>=7", "build>=1.0", "requests>=2.28", "beautifulsoup4>=4.12", "import-linter>=2.0"]
# tools: for a project that ran `lawkeeper init --with-tools` (ADR-009) and
# wants to actually run the installed ai_review.py/consensus_review.py --
# real bug found 2026-09-04 while adding a real end-to-end test for
# --with-tools: ai_review.py imports `requests` at module load, but nothing
# declared it installable for a consuming project, only for this dev repo's
# own [dev] extra above. `pip install lawkeeper[tools]` is the real fix.
# team_chat.py needs nothing beyond stdlib, so it's not what drove this.
tools = ["requests>=2.28"]
# The "agent" extra (claude-agent-sdk, for guardrail.agent's Stage-1
# downloadable-prototype integration) was removed 2026-09-04 along with
# guardrail/agent.py itself -- see ARCHITECTURE_DECISIONS.md ADR-008.
# Zero real callers after weeks; Stage 2-4 of docs/LAWKEEPER_PROTOTYPE_PLAN.md
# never got built. Resurrect from git history (`git log --all -- src/guardrail/agent.py`)
# if that work resumes.

[project.scripts]
lawkeeper = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: this path is relative to the PACKAGE directory (src/guardrail/),
# not the repo root. The template/ folder must live at src/guardrail/template
# for this to actually ship inside a built wheel. Verified with:
#   python -m build --wheel && python -m zipfile -l dist/*.whl | grep template
[tool.setuptools.package-data]
# template_extras/ (ADR-009): opt-in tools installed only by
# `lawkeeper init --with-tools` — same packaging requirement as template/
# above (must live inside the package dir for setuptools/wheel to ship it).
guardrail = ["template/**/*", "template_extras/**/*"]

[tool.pytest.ini_options]
# Was an exact-filename allowlist -- switched 2026-08-20 after it silently
# excluded new test files from the suite for the third time in one night
# (test_memory_provider.py and test_user_preference_provider.py both
# passed when run directly but were never collected by `pytest -q`,
# each requiring someone to notice the total-count mismatch by hand).
# Verified before switching, not assumed: the Law 18 theory-card gate
# (scripts/validate_pre_commit.py) checks git-staged files under tests/
# directly and does not read this setting -- glob discovery here cannot
# weaken that gate. Standard pytest discovery, matches this repo's own
# test file naming convention exactly (every file already starts with
# test_).
python_files = ["test_*.py"]
markers = [
    "slow: end-to-end tests that build a wheel and create a venv (test_init_smoke.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
