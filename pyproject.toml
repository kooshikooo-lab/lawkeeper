[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawkeeper"
version = "0.1.0"
description = "Constitution-as-code governance for agentic + vibe-coded projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# requests: not used by the shipped guardrail package itself, only by
# maintainer scripts that call OpenRouter/team-chat (ai_review.py,
# consensus_review.py, team_chat.py) -- dev-only, same reasoning as
# pytest/build here.
dev = ["pytest>=7", "build>=1.0", "requests>=2.28"]
# claude-agent-sdk: real, shipped-package dependency for
# guardrail.agent's Stage-1 downloadable-prototype integration
# (docs/LAWKEEPER_PROTOTYPE_PLAN.md) -- kept optional rather than a
# hard dependency since most lawkeeper installs (the governance CLI
# itself) don't need it; deferred-imported inside
# build_governed_options() specifically so the rest of the package
# stays importable/testable without it installed.
agent = ["claude-agent-sdk>=0.2"]

[project.scripts]
lawkeeper = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: this path is relative to the PACKAGE directory (src/guardrail/),
# not the repo root. The template/ folder must live at src/guardrail/template
# for this to actually ship inside a built wheel. Verified with:
#   python -m build --wheel && python -m zipfile -l dist/*.whl | grep template
[tool.setuptools.package-data]
guardrail = ["template/**/*"]

[tool.pytest.ini_options]
# Was an exact-filename allowlist -- switched 2026-08-20 after it silently
# excluded new test files from the suite for the third time in one night
# (test_memory_provider.py and test_user_preference_provider.py both
# passed when run directly but were never collected by `pytest -q`,
# each requiring someone to notice the total-count mismatch by hand).
# Verified before switching, not assumed: the Law 18 theory-card gate
# (scripts/validate_pre_commit.py) checks git-staged files under tests/
# directly and does not read this setting -- glob discovery here cannot
# weaken that gate. Standard pytest discovery, matches this repo's own
# test file naming convention exactly (every file already starts with
# test_).
python_files = ["test_*.py"]
markers = [
    "slow: end-to-end tests that build a wheel and create a venv (test_init_smoke.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
