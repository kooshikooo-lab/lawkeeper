[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail"
version = "0.1.0"
description = "Constitution-as-code governance for agentic + vibe-coded projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lawkeeper = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrail = ["template/**/*"]

[tool.pytest.ini_options]
python_files = [
    "test_guard_scripts.py",
    "test_template.py",
    "test_framework.py",
    "test_e2e.py",
    "test_reasoning.py",
    "test_choices.py",
    "test_adversarial_review_checker.py",
    "test_code_compliance_checker.py",
    "test_check_declared_dependencies.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
