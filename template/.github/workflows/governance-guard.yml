name: governance-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + hooks
        run: |
          pip install -e .[dev]
          python scripts/install_hooks.py
      - name: Block unauthorized governance edits and unmarked provisional work
        run: |
          python scripts/validate_commit_msg.py
      - name: Check local dependencies are present for imported declared packages
        run: |
          python scripts/check_local_dependencies.py --warn
      - name: Compliance watchdog — constitution laws match, no new violations vs baseline
        run: |
          python scripts/compliance_watchdog.py --check-laws
          python scripts/compliance_watchdog.py --check-baseline
      - name: Dependency tool registry (phantom / orphan / unwired)
        run: |
          python scripts/toolcheck.py
      - name: System self-audit (Law 16 — enforcement layers active and correct)
        run: |
          python scripts/system_audit.py
      - name: Framework + guard meta-tests (Law 16.5)
        run: |
          python -m pytest tests/ -q
    powershell-lint:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - name: PowerShell 5.1 compatibility lint
          shell: powershell
          run: |
            python scripts/check_powershell_51_compat.py

  dependency-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirements lock files are up to date
        run: |
          python scripts/compile_requirements.py --check
