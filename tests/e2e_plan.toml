# Machine-readable e2e test plan for lawkeeper.
# Mirror of tests/e2e_PLAN.md. Consumed by nothing yet, but makes the
# approved defaults explicit and diffable.

keep_mvp = true

# categories exercised by tests/test_e2e.py
scope = [
    "commits",         # scaffold a governed repo, commit, lawkeeper run -> PASS
    "bugs",            # missing README / orphan branch -> FAIL, exit 1
    "commit_msg_gate", # .py change without Tests: -> blocked
    "pre_commit_gate", # bare except / wrong placement -> blocked
    "conflicts",       # merge_gate predicts conflict (rc1) and clean (rc0)
]

# merge_gate re-verification
merge_gate_verified = "2026-08-07 git 2.55 divergent sibling branches -> rc1 CONFLICT(content); probe error corrected"
merge_gate_reverify_target = "linux-ci"

import_order = ["instrument-designer", "autonomi-code-assistant"]

green_gate = [
    "python -m pytest tests/ -q",
    "python -m guardrail.cli run",
    "python scripts/system_audit.py",
    "python scripts/compliance_watchdog.py --check-laws",
    "python scripts/compliance_watchdog.py --check-baseline",
]
